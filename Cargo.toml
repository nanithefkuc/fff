[package]
name = "fff"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Faster Finite Fields: SIMD and portable binary tower arithmetic and vector kernels"
license = "MIT"
repository = "https://github.com/nanithefkuc/fff"
readme = "README.md"
homepage = "https://github.com/nanithefkuc/fff"
publish = false

[features]
default = ["std", "simd"]
# Standard library. Required for the lazily-built shared table banks and the
# `simdispatch` runtime detection selected by `simd`.
std = []
# Runtime-dispatched SIMD kernels: v3_gfni_crypto / v3 / v2 on x86 (the
# 64-byte AVX-512 tier is deferred), neon_aes / neon on AArch64, and
# `wasm128` on Wasm. Enabling also resolves the backend via `simdispatch`.
simd = ["std"]
# Expose the crate's internal kernel modules and preparation types for
# downstream libraries that build directly on the kernels. This is not a
# stable semver surface; it is for development of dependent libraries.
internals = []

[dependencies]
# Level 0 single source for SIMD capability selection: detection, ordering,
# and the downgrade-only `SIMD_BACKEND` override are owned upstream. Pinned to
# the `v0.0.0` tag (see simdispatch repo). Swap this rev with the dependent
# consumers (cafft) in the same sitting.
simdispatch = { git = "https://github.com/nanithefkuc/simdispatch", rev = "5940194107384953cd8cd9f45c8d902b26d5686e" }

# Comparison benchmarks only; the C `simd-accel` path has no wasm sysroot, and
# scoping it here keeps `cargo test --target wasm32-*` buildable.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
reed-solomon-erasure = { version = "6", features = ["simd-accel"] }

[profile.bench]
lto = "thin"
codegen-units = 1

[[bench]]
name = "kernels"
harness = false
# `ops::Plan` and the comparison harness are std-only; without this the bench
# targets break `--no-default-features --all-targets`.
required-features = ["std"]

[[bench]]
name = "compare"
harness = false
required-features = ["std"]
